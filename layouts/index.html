{{ define "title" }}{{ i18n "homePageTitle" }}{{ end }}

{{ define "main" }}
<div class="home-header">
  {{ partial "nav.html" . }}

  <div class="js-home-header-slide home-header-slide" dir="ltr">
    <div><a href="{{ "/calendar/" | relLangURL }}"><div class="cover-img-white-bg cover-img-content-1"></div></a></div>
    <div><a href="{{ "/dasht/" | relLangURL }}"><div class="cover-img-white-bg cover-img-content-2"></div></a></div>
    <div><a href="{{ "/kajdar/" | relLangURL }}"><div class="cover-img-white-bg cover-img-content-3"></div></a></div>
    <div><a href="{{ "/bahambesazim/" | relLangURL }}"><div class="cover-img cover-img-content-4"></div></a></div>
  </div>
</div>

<div class="container-fluid promotion">
  <div class="row">
    <a class="promo-link" href="{{ "/products/" | relLangURL }}">
      <div class="col-sm-3 u-fit">
        <div class="promo-text"><p>{{ i18n "homePromoProducts" }}</p></div>
        <img src="{{ "images/a11.jpg" | relURL }}">
      </div>
    </a>

    <a class="promo-link" href="{{ "/dasht/" | relLangURL }}">
      <div class="col-sm-3 u-fit">
        <div class="promo-text"><p>{{ i18n "homePromoDasht" }}</p></div>
        <img src="{{ "images/l11.jpg" | relURL }}">
      </div>
    </a>

    <a class="promo-link" href="{{ "/workshops/" | relLangURL }}">
      <div class="col-sm-3 u-fit">
        <div class="promo-text light"><p>{{ i18n "homePromoWorkshops" }}</p></div>
        <img src="{{ "images/w1.jpg" | relURL }}">
      </div>
    </a>

    <a class="promo-link" href="{{ "/about-us/" | relLangURL }}">
      <div class="col-sm-3 u-fit">
        <div class="promo-text"><p>{{ i18n "homePromoAboutUs" }}</p></div>
        <img src="{{ "images/u11.jpg" | relURL }}">
      </div>
    </a>
  </div>
</div>

<p class="footer-photos-right">{{ i18n "homePhotoCredit" }}: <a href="http://Likostudio.com">Likostudio</a></p>
{{ end }}
